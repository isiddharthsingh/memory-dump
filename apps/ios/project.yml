# XcodeGen spec. Run `xcodegen` in this folder to (re)generate
# MemoryDump.xcodeproj, which is gitignored.
name: MemoryDump
options:
  bundleIdPrefix: com.siddharthsingh
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "1.0.0"
    # 2: the first build that asks for AI consent. With the backend that
    # requires it, set MIN_APP_BUILD=2 so older builds, which can't give it
    # and would see every save fail, are told to update.
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    # Free Personal Team for now: device builds expire after 7 days, and push
    # is off (see aps-environment below). Swap in the paid team ID later.
    DEVELOPMENT_TEAM: L53NYQQX76
    ENABLE_USER_SCRIPT_SANDBOXING: YES

# Pinned to a commit, the one tagged 5.0.15: the generated project, and the
# Package.resolved inside it, are gitignored, and a tag can be moved. This is
# the maintained home of the library; marmelroy/PhoneNumberKit is frozen at
# 4.3.0 and points here.
packages:
  PhoneNumberKit:
    url: https://github.com/PhoneNumberKit/PhoneNumberKit
    revision: 3c9c4e9f084c7bf8b51b1f078867dbd8f51eb1b2

targets:
  MemoryDump:
    type: application
    platform: iOS
    sources:
      - MemoryDump
      - Shared
      - path: Generated/MemoryDump/Server.swift
        optional: true
      # What the app collects and which required-reason APIs it calls, for
      # App Review. Kept outside MemoryDump/ so it isn't picked up twice.
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharthsingh.memorydump
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: MemoryDump/Info.plist
      properties:
        CFBundleDisplayName: Memory Dump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Newsreader_400Regular.ttf
          - Newsreader_500Medium.ttf
          - Newsreader_600SemiBold.ttf
          - BricolageGrotesque_600SemiBold.ttf
          - BricolageGrotesque_700Bold.ttf
          - BricolageGrotesque_800ExtraBold.ttf
        NSMicrophoneUsageDescription: Allow Memory Dump to use the microphone so you can ask questions by voice.
        NSSpeechRecognitionUsageDescription: Memory Dump turns what you say into a question. Your audio is processed on your iPhone, or by Apple when on-device recognition isn't available.
        NSLocalNetworkUsageDescription: Memory Dump uses your local network only to reach a development server on your Wi-Fi.
        # Plain http:// to *.local and unqualified hosts, for a server on your Wi-Fi.
        # Same exception the Expo app had.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        KeychainAccessGroup: $(AppIdentifierPrefix)com.siddharthsingh.memorydump.shared
    entitlements:
      path: MemoryDump/MemoryDump.entitlements
      properties:
        # Personal Teams can't sign push. With a paid team, add back:
        #   aps-environment: development
        com.apple.security.application-groups:
          - group.com.siddharthsingh.memorydump
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.siddharthsingh.memorydump.shared
    # The server address is API_DOMAIN from the repo's .env, the backend's own
    # public address, compiled in as Server.url from the gitignored Generated/
    # folder. The extension runs the same step into its own file.
    preBuildScripts: &serverAddress
      - name: Server address
        script: |
          # Read the way python-dotenv and Compose do: an optional `export`,
          # quotes, and a ` # comment` after the value.
          url=$(sed -nE 's/^[[:space:]]*(export[[:space:]]+)?API_DOMAIN[[:space:]]*=[[:space:]]*//p' \
            "$SCRIPT_INPUT_FILE_0" 2>/dev/null | tail -n 1 | tr -d "\"'\r" \
            | sed -e 's/[[:space:]]#.*//' -e 's/[[:space:]]*$//' -e 's:/*$::')
          if [ -z "$url" ]; then
            # The backend's default too.
            url=http://localhost:8000
            echo "warning: API_DOMAIN isn't set in the repo's .env, so this build talks to $url."
          fi
          # A scheme, a host and an optional path, with nothing that would break
          # the Swift string below.
          if ! printf '%s' "$url" | grep -Eq '^https?://[^/[:space:]?#"\\]+(/[^[:space:]?#"\\]*)?$'; then
            echo "error: API_DOMAIN in .env must be an http:// or https:// address, not $url"
            exit 1
          fi
          # A release build goes to people's phones, and its traffic to the
          # backend must be encrypted.
          if [ "$CONFIGURATION" = Release ] && [ "${url%%:*}" = http ]; then
            echo "error: API_DOMAIN in .env is $url. Release builds need an https:// API_DOMAIN."
            exit 1
          fi
          host=$(printf '%s' "$url" | sed -E 's#^https?://([^/:]+).*#\1#')
          if [ "$PLATFORM_NAME" = iphoneos ] && { [ "$host" = localhost ] || [ "$host" = 127.0.0.1 ]; }; then
            echo "error: API_DOMAIN in .env is $url, which a phone can't reach. Use the server's public address, or http://<your-mac>.local:8000 on the Mac's Wi-Fi."
            exit 1
          fi
          # App Transport Security lets plain http through only to unqualified
          # names, .local names and IP addresses (NSAllowsLocalNetworking).
          if [ "${url%%:*}" = http ]; then
            case "$host" in
              *.local) ;;
              *[!0-9.]*.* | *.*[!0-9.]*)
                echo "warning: API_DOMAIN in .env is plain http to $host, which App Transport Security blocks. Use https." ;;
            esac
          fi
          mkdir -p "$(dirname "$SCRIPT_OUTPUT_FILE_0")"
          cat > "$SCRIPT_OUTPUT_FILE_0" <<EOF
          // Generated from API_DOMAIN in the repo's .env by the Server address build phase.
          import Foundation

          enum Server {
            static let url = URL(string: "$url")!
          }
          EOF
        inputFiles:
          - $(PROJECT_DIR)/../../.env
        outputFiles:
          - $(PROJECT_DIR)/Generated/$(TARGET_NAME)/Server.swift
    dependencies:
      - target: ShareExtension
      - package: PhoneNumberKit
    scheme:
      testTargets:
        - MemoryDumpTests

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
      - path: Generated/ShareExtension/Server.swift
        optional: true
      - path: Privacy/ShareExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharthsingh.memorydump.share
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts: *serverAddress
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Memory Dump
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KeychainAccessGroup: $(AppIdentifierPrefix)com.siddharthsingh.memorydump.shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Links, text, images and PDFs; the same rule the Expo extension used.
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $extensionItem, SUBQUERY($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.text" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf" || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.file-url").@count > 0).@count > 0'
            # Present over the app instead of in a sheet: no dimming, shadow or
            # white background, so only the status pill shows.
            NSExtensionShareWantsFullScreenPresentation: true
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.siddharthsingh.memorydump
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.siddharthsingh.memorydump.shared

  MemoryDumpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MemoryDump
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.siddharthsingh.memorydump.tests
