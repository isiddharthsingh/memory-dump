[project]
name = "memory-dump-backend"
version = "0.1.0"
description = "Backend for the personal memory-dump app: ingest links, analyze, embed, ask."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.2",
    "httpx[http2]>=0.27",
    # Its network backend checks linked pages' addresses (app/extractors/webpage.py).
    "httpcore>=1.0",
    "anthropic>=2.3",
    "voyageai>=0.3",
    "yt-dlp>=2024.12.13",
    # Transcripts of Instagram reels (app/extractors/reel.py).
    "faster-whisper>=1.2",
    "youtube-transcript-api>=0.6.3",
    "trafilatura>=1.12",
    "selectolax>=0.3.25",
    "python-slugify>=8.0",
    "tenacity>=9.0",
    "structlog>=24.4",
    "supertokens-python>=0.31.4,<0.32",
    # APNs provider tokens (app/notifications.py).
    "pyjwt[crypto]>=2.10",
    # Uploads in an S3-compatible bucket (app/storage.py).
    "boto3>=1.35",
    # Thumbnails of uploaded images and PDFs (app/thumbnails.py).
    "pillow>=11",
    "pypdfium2>=4.30",
    "prometheus-client>=0.21",
    "sentry-sdk>=2.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
