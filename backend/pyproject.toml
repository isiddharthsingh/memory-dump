[project]
name = "memory-dump-backend"
version = "0.1.0"
description = "Backend for the personal memory-dump app: ingest links, analyze, embed, ask."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "arq>=0.26",
    "redis>=5.2",
    "httpx>=0.27",
    "anthropic>=0.40",
    "voyageai>=0.3",
    "yt-dlp>=2024.12.13",
    "youtube-transcript-api>=0.6.3",
    "trafilatura>=1.12",
    "selectolax>=0.3.25",
    "python-slugify>=8.0",
    "tenacity>=9.0",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pytest_asyncio]
asyncio_mode = "auto"
