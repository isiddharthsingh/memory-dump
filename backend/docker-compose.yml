# The stack as it runs in production:
#   docker compose -f docker-compose.yml up -d
# Plain `docker compose up` also merges docker-compose.override.yml, which adds
# the development conveniences (published database ports, code mounted with
# reload).
#
# Only the API's port is published, and only on this machine (127.0.0.1): put
# a TLS-terminating proxy on the host in front of it, and set
# FORWARDED_ALLOW_IPS (in ../.env) to the address the proxy's requests arrive
# from so uvicorn takes client addresses from X-Forwarded-For (the sign-in rate
# limit counts per address). For Postgres, prefer a managed instance with
# point-in-time recovery over the postgres-data volume.
#
# POSTGRES_PASSWORD, REDIS_PASSWORD, SUPERTOKENS_API_KEY and the S3 key pair
# must be set (in your shell or backend/.env; compose won't start without
# them): the sandboxed children that decode uploads can reach this network,
# so nothing on it may answer without a secret.
services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memory}
      # Used when the volume is first created; changing it later needs
      # ALTER USER as well (see AGENTS.md).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: ${POSTGRES_DB:-memory_dump}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memory} -d ${POSTGRES_DB:-memory_dump}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The job queue lives here, so: an append-only file synced every second, so
  # a restart loses at most a second of queued jobs (the reconciler puts back
  # the rest), and no eviction, so memory pressure fails writes loudly instead
  # of dropping jobs. REDIS_PASSWORD comes from your shell or backend/.env,
  # like POSTGRES_*, and the api and worker are handed REDIS_URL built from it.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}
    command:
      - sh
      - -c
      - >
        exec redis-server --appendonly yes --appendfsync everysec
        --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - '[ -n "$$REDIS_PASSWORD" ] && export REDISCLI_AUTH="$$REDIS_PASSWORD"; redis-cli ping | grep -q PONG'
      interval: 5s
      timeout: 3s
      retries: 10

  # SuperTokens core: users, password hashes and sessions. It keeps its tables in
  # the `supertokens` schema of the same database. API_KEYS must match
  # SUPERTOKENS_API_KEY in ../.env; like POSTGRES_*, compose reads it from your
  # shell or backend/.env.
  supertokens:
    image: registry.supertokens.io/supertokens/supertokens-postgresql:12.4.3
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_CONNECTION_URI: postgresql://${POSTGRES_USER:-memory}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}@postgres:5432/${POSTGRES_DB:-memory_dump}
      POSTGRESQL_TABLE_SCHEMA: supertokens
      # Without it the core answers anyone on this network, who could then
      # sign in as any user.
      API_KEYS: ${SUPERTOKENS_API_KEY:?set SUPERTOKENS_API_KEY in backend/.env}
      # 15-minute access tokens, refresh tokens that expire after 30 days unused.
      ACCESS_TOKEN_VALIDITY: 900
      REFRESH_TOKEN_VALIDITY: 43200
      # Argon2id for new passwords, like the hashes imported from before; the
      # core's default is bcrypt.
      PASSWORD_HASHING_ALG: ARGON2
      DISABLE_TELEMETRY: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3567/hello"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Upload storage (STORAGE_BACKEND=s3, S3_ENDPOINT_URL=http://seaweedfs:8333):
  # every uploaded file and its thumbnail, behind an S3 API on the compose
  # network only. The api serves thumbnails to the app; nothing else reaches
  # it. Like SUPERTOKENS_API_KEY, the key pair comes from your shell or
  # backend/.env and goes to the api and worker too, so they can't disagree;
  # the bucket is created on the first upload.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: ["server", "-s3", "-master.telemetry=false"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in backend/.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in backend/.env}
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Migrations run once, before the api and worker start, rather than in every
  # api process (several would race).
  migrate:
    build: .
    restart: "no"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      supertokens:
        condition: service_healthy
    environment:
      # The secrets the services were given, from the same place (your shell
      # or backend/.env), so they can't disagree.
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:?set SUPERTOKENS_API_KEY in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    security_opt:
      - no-new-privileges:true
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:?set SUPERTOKENS_API_KEY in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}@redis:6379/0
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      # uvicorn worker processes; each has its own database pool
      # (DB_POOL_SIZE + DB_MAX_OVERFLOW connections).
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Where those processes pool their metrics for /metrics.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      supertokens:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # This machine only, for a proxy on the host; the override publishes it
    # on every interface for development.
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    command:
      - sh
      - -c
      - >
        rm -rf "$$PROMETHEUS_MULTIPROC_DIR" && mkdir -p "$$PROMETHEUS_MULTIPROC_DIR" &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - uploads:/uploads
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/readyz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build: .
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      SUPERTOKENS_API_KEY: ${SUPERTOKENS_API_KEY:?set SUPERTOKENS_API_KEY in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in backend/.env}@redis:6379/0
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    command: ["arq", "app.workers.worker.WorkerSettings"]
    # It reads what strangers' links and files hold: a ceiling on its memory
    # keeps one bad input from taking the host (and Postgres) down with it.
    mem_limit: ${WORKER_MEM_LIMIT:-4g}
    security_opt:
      - no-new-privileges:true
    # Reaps the ffmpeg a timed-out reel child leaves (app/extractors/reel.py):
    # arq, as PID 1, wouldn't.
    init: true
    volumes:
      - uploads:/uploads
      # APNs .p8 key (gitignored). Point APNS_KEY_PATH at /run/secrets/<file>.
      - ../secrets:/run/secrets:ro
    healthcheck:
      # Fails once the worker stops refreshing its health-check key in Redis.
      test: ["CMD", "arq", "--check", "app.workers.worker.WorkerSettings"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  uploads:
  seaweedfs-data:
